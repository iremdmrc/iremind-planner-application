<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reminder - Iremind</title>
  <link rel="stylesheet" href="/src/study.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
  <div class="page-shell">
    <div class="study-shell">
      <aside class="sidebar">
        <div class="sidebar-logo">Iremind<span class="logo-dot">.</span></div>
        <nav class="sidebar-nav">
          <a href="dashboard.html" class="menu-item"><i class="fas fa-chart-line"></i> Dashboard</a>
          <a href="calendar.html" class="menu-item"><i class="fas fa-calendar-alt"></i> Calendar</a>
          <a href="todo.html" class="menu-item"><i class="fas fa-calendar-alt"></i> To-Do List</a>
          <a href="notes.html" class="menu-item"><i class="fas fa-sticky-note"></i> Notes</a>
          <a href="reminder.html" class="menu-item active"><i class="fas fa-bell"></i> Reminder</a>
          <a href="chat.html" class="menu-item"><i class="fas fa-comment-dots"></i> Chats <span class="menu-item-badge">0</span></a>
        </nav>
        <div class="quote-card">
          <div class="quote-card-tag">Today's reminder</div>
          <p>"Every focused minute moves you forward."</p>
          <p class="quote-card-author">- Iremind</p>
        </div>
        <div class="sidebar-footer">
          <a href="settings.html" class="menu-item"><i class="fas fa-cog"></i> Settings</a>
          <a href="index.html" class="menu-item"><i class="fas fa-sign-out-alt"></i> Log Out</a>
        </div>
      </aside>

      <main class="study-main reminder-main">
        <header class="study-header">
          <div>
            <h1 class="page-title">Reminder</h1>
          </div>
          <div class="user-profile"><img src="" hidden alt="User Avatar" /></div>
        </header>

        <p class="notif-summary" id="notif-summary">All your reminders, in one quiet place.</p>

        <div class="notif-toolbar">
          <button class="notif-tab is-active" data-filter="all" type="button">
            <i class="fas fa-inbox"></i> All <span class="notif-tab-count" id="count-all">0</span>
          </button>
          <button class="notif-tab" data-filter="EVENT" type="button">
            <i class="fas fa-calendar-day"></i> Events <span class="notif-tab-count" id="count-event">0</span>
          </button>
          <button class="notif-tab" data-filter="TASK" type="button">
            <i class="fas fa-circle-check"></i> Tasks <span class="notif-tab-count" id="count-task">0</span>
          </button>
          <button class="notif-tab" data-filter="DONE" type="button">
            <i class="fas fa-check-double"></i> Cleared <span class="notif-tab-count" id="count-done">0</span>
          </button>
        </div>

        <section class="notif-feed" id="reminder-list">
          <div class="notif-skeleton">
            <span></span><span></span><span></span>
          </div>
        </section>
      </main>
    </div>

    <footer class="iremind-footer">
      <div class="footer-main">
        <span class="footer-brand">iREMIND</span>
      </div>
      <div class="social-links">
        <a href="#" aria-label="iREMIND Instagram"><i class="fab fa-instagram"></i></a>
        <a href="#" aria-label="iREMIND Twitter"><i class="fab fa-twitter"></i></a>
        <a href="#" aria-label="iREMIND Facebook"><i class="fab fa-facebook-f"></i></a>
        <a href="#" aria-label="iREMIND YouTube"><i class="fab fa-youtube"></i></a>
      </div>
      <div class="footer-bottom">
        <span>© 2025 iREMIND. All rights reserved.</span>
        <div class="footer-links">
          <a href="#">Privacy</a>
          <span class="dot">•</span>
          <a href="#">Terms</a>
          <span class="dot">•</span>
          <a href="#">Support</a>
        </div>
      </div>
    </footer>
  </div>

  <script type="module" src="/src/app-shell.js"></script>
  <script type="module" src="/src/reminder.js"></script>
</body>
</html>
