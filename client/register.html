<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Create Account - iRemind</title>
  <link rel="icon" href="./images/first-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="/src/auth.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="login-page auth-register-page">

  <video id="bg-video" autoplay loop muted playsinline>
    <source src="./videos/background.mp4" type="video/mp4">
  </video>

  <div class="auth-classic">
    <div class="auth-classic-inner">

      <div class="auth-illustration">
        <img src="./images/loginimg.png" alt="iRemind" />
      </div>

      <div class="auth-card-classic">
        <div class="auth-theme-row">
          <button type="button" data-auth-theme="light" class="auth-theme-btn">
            <i class="fas fa-sun"></i> Light
          </button>
          <button type="button" data-auth-theme="dark" class="auth-theme-btn">
            <i class="fas fa-moon"></i> Dark
          </button>
        </div>

        <div class="auth-card-eyebrow">Get started free</div>
        <h1 class="auth-card-title">Create your account</h1>
        <p class="auth-card-subtitle">Start planning your studies in less than a minute.</p>

        <form id="register-form" class="auth-form">
          <div class="error auth-error" style="display:none"></div>

          <div class="auth-field">
            <label class="auth-label" for="reg-fullname">Full Name</label>
            <div class="auth-input-wrap">
              <i class="fas fa-user auth-input-icon"></i>
              <input id="reg-fullname" class="auth-input" type="text" name="fullname" required placeholder="Your full name" />
            </div>
          </div>

          <div class="auth-field">
            <label class="auth-label" for="reg-username">Username</label>
            <div class="auth-input-wrap">
              <i class="fas fa-at auth-input-icon"></i>
              <input id="reg-username" class="auth-input" type="text" name="username" required placeholder="Choose a username" />
            </div>
          </div>

          <div class="auth-field">
            <label class="auth-label" for="reg-email">Email</label>
            <div class="auth-input-wrap">
              <i class="fas fa-envelope auth-input-icon"></i>
              <input id="reg-email" class="auth-input" type="email" name="email" required autocomplete="email" placeholder="you@university.edu" />
            </div>
          </div>

          <div class="auth-field">
            <label class="auth-label" for="reg-password">Password</label>
            <div class="auth-input-wrap">
              <i class="fas fa-lock auth-input-icon"></i>
              <input id="reg-password" class="auth-input" type="password" name="password" required autocomplete="new-password" placeholder="Min. 8 characters" />
              <button type="button" class="auth-pass-toggle" tabindex="-1">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <label class="auth-terms">
            <input type="checkbox" id="terms" required />
            <span>I agree to iRemind's <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</span>
          </label>

          <button class="btn-primary" type="submit">
            <i class="fas fa-user-plus"></i>
            Create Account
          </button>

          <div class="social-login-separator">or sign up with</div>

          <div class="social-login">
            <button type="button" class="btn-social">
              <i class="fab fa-google"></i> Google
            </button>
            <button type="button" class="btn-social">
              <i class="fab fa-apple"></i> Apple
            </button>
          </div>
        </form>

        <p class="auth-switch">
          Already have an account? <a href="index.html">Sign in</a>
        </p>
      </div>
    </div>
  </div>

  <script type="module" src="/src/auth.js"></script>
</body>
</html>
