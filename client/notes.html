<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Notes - Iremind</title>
  <link rel="stylesheet" href="/src/study.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
  <div class="page-shell">
    <div class="study-shell">
      <aside class="sidebar">
        <div class="sidebar-logo">Iremind<span class="logo-dot">.</span></div>
        <nav class="sidebar-nav">
          <a href="dashboard.html" class="menu-item"><i class="fas fa-chart-line"></i> Dashboard</a>
          <a href="calendar.html" class="menu-item"><i class="fas fa-calendar-alt"></i> Calendar</a>
          <a href="todo.html" class="menu-item"><i class="fas fa-calendar-alt"></i> To-Do List</a>
          <a href="notes.html" class="menu-item active"><i class="fas fa-sticky-note"></i> Notes</a>
          <a href="reminder.html" class="menu-item"><i class="fas fa-bell"></i> Reminder</a>
          <a href="chat.html" class="menu-item"><i class="fas fa-comment-dots"></i> Chats <span class="menu-item-badge">0</span></a>
        </nav>
        <div class="quote-card">
          <div class="quote-card-tag">Today's reminder</div>
          <p>"Every focused minute moves you forward."</p>
          <p class="quote-card-author">- Iremind</p>
        </div>
        <div class="sidebar-footer">
          <a href="settings.html" class="menu-item"><i class="fas fa-cog"></i> Settings</a>
          <a href="index.html" class="menu-item"><i class="fas fa-sign-out-alt"></i> Log Out</a>
        </div>
      </aside>

      <main class="study-main notes-main classic-notes-main">
        <header class="study-header">
          <div>
            <h1 class="page-title">Notes</h1>
          </div>
          <div class="user-profile"><img src="" hidden alt="User Avatar" /></div>
        </header>

        <section class="note-editor classic-note-editor">
          <span class="editor-kicker">Add a Note</span>
          <input id="note-title" placeholder="Title" maxlength="100" />
          <textarea id="note-content" placeholder="Take a note..." rows="7"></textarea>
          <div class="editor-actions">
            <input id="note-search" placeholder="Search notes" />
            <button class="primary-pill" id="save-note-btn">Save note</button>
          </div>
        </section>

        <section class="notes-board" id="notes-board"></section>
      </main>
    </div>

    <footer class="iremind-footer">
      <div class="footer-main">
        <span class="footer-brand">iREMIND</span>
      </div>
      <div class="social-links">
        <a href="#" aria-label="iREMIND Instagram"><i class="fab fa-instagram"></i></a>
        <a href="#" aria-label="iREMIND Twitter"><i class="fab fa-twitter"></i></a>
        <a href="#" aria-label="iREMIND Facebook"><i class="fab fa-facebook-f"></i></a>
        <a href="#" aria-label="iREMIND YouTube"><i class="fab fa-youtube"></i></a>
      </div>
      <div class="footer-bottom">
        <span>© 2025 iREMIND. All rights reserved.</span>
        <div class="footer-links">
          <a href="#">Privacy</a>
          <span class="dot">•</span>
          <a href="#">Terms</a>
          <span class="dot">•</span>
          <a href="#">Support</a>
        </div>
      </div>
    </footer>
  </div>

  <script type="module" src="/src/app-shell.js"></script>
  <script type="module" src="/src/notes.js"></script>
</body>
</html>
